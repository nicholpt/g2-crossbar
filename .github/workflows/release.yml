name: Release

# Push a tag like v1.0.3 to publish crossbar.ehpk (with its SBOM) as a GitHub Release. The tag
# must match "version" in app.json, package.json and package-lock.json, and
# CHANGELOG.md's section for that version becomes the release notes.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 20
    environment: release # deployable from v* tags only (repo settings)
    permissions:
      contents: write     # create the release
      id-token: write     # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # main's history, for the check below
          persist-credentials: false # gh uses GH_TOKEN; nothing else may push
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # no npm cache: the release installs fresh from the registry
      - name: Tag is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_REF_NAME ($GITHUB_SHA) isn't on main"; exit 1; }
      - name: Tag matches the version
        run: |
          v=$(node -p 'require("./app.json").version')
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but app.json says $v"; exit 1; }
      - run: brew install tmux
      - run: npm ci
      - run: npm audit signatures # every package's registry signature and provenance
      - run: npm test # includes: package.json, the lockfile and CHANGELOG.md agree with app.json
      - run: npm run pack
      - name: Checksum
        run: shasum -a 256 crossbar.ehpk > crossbar.ehpk.sha256
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: crossbar.ehpk
      - name: SBOM (CycloneDX)
        run: npm run sbom
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: crossbar.ehpk
          sbom-path: crossbar.sbom.cdx.json
      - name: Release notes from CHANGELOG.md
        run: |
          v=${GITHUB_REF_NAME#v}
          awk -v h="## $v" '$0 == h {on = 1; next} /^## / {on = 0} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no '## $v' section"; exit 1; }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" crossbar.ehpk crossbar.ehpk.sha256 crossbar.sbom.cdx.json --notes-file notes.md --title "Crossbar $GITHUB_REF_NAME"
